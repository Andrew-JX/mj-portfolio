name: Deploy to Tencent Cloud

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mj-portfolio-tencent-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy production site
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEPLOY_HOST: ${{ secrets.TENCENT_HOST }}
      DEPLOY_USER: ${{ secrets.TENCENT_USER }}
      RELEASE_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production site
        run: npm run build

      - name: Verify build output
        run: |
          test -s dist/index.html
          test -d dist/assets
          grep -q '苏ICP备2026054660号-1' dist/index.html

      - name: Configure deployment SSH key
        env:
          DEPLOY_KEY: ${{ secrets.TENCENT_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.TENCENT_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/tencent_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/tencent_deploy ~/.ssh/known_hosts

      - name: Package release
        run: |
          tar -czf "/tmp/mj-portfolio-${RELEASE_ID}.tar.gz" -C dist .

      - name: Upload, activate, and verify release
        run: |
          cat "/tmp/mj-portfolio-${RELEASE_ID}.tar.gz" | ssh \
            -i ~/.ssh/tencent_deploy \
            -o IdentitiesOnly=yes \
            -o ServerAliveInterval=30 \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "deploy ${RELEASE_ID}"
