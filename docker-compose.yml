services:
  mj-portfolio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mj-portfolio
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      # SSL 证书挂载：把证书文件放到服务器 ./ssl/ 目录下
      - ./ssl:/etc/nginx/ssl:ro

