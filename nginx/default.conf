# HTTP -> HTTPS 重定向
server {
  listen 80;
  server_name jimmyuuu.com www.jimmyuuu.com;

  # 证书签好之前可先注释掉 redirect，直接用 80 端口提供服务
  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  http2 on;
  # mj 子域必须显式列出：ops/deploy-mj-portfolio.sh 用 https://mj.jimmyuuu.com/ 做发布校验，
  # 靠「默认落到第一个 server 块」撑着，加一个新块就会悄悄弄坏生产站。
  server_name jimmyuuu.com www.jimmyuuu.com mj.jimmyuuu.com;

  # --- SSL 证书（Let's Encrypt / 云厂商免费证书均可）---
  ssl_certificate     /etc/nginx/ssl/jimmyuuu.com.pem;
  ssl_certificate_key /etc/nginx/ssl/jimmyuuu.com.key;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_ciphers         HIGH:!aNULL:!MD5;
  ssl_session_cache   shared:SSL:10m;
  ssl_session_timeout 10m;

  # --- 安全头（location 里自带 add_header 时不会继承这里，见 security-headers.inc）---
  include /etc/nginx/conf.d/security-headers.inc;

  # --- gzip 压缩 ---
  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
  gzip_min_length 1024;
  gzip_vary on;

  root /usr/share/nginx/html;
  index index.html;

  # 作品集是 Vite 构建的静态站点（当前使用 hash 路由），这里做兜底回退
  location / {
    try_files $uri $uri/ /index.html;
  }

  # 基础缓存策略（静态资源长期缓存）
  location ~* \.(?:css|js|mjs|png|jpg|jpeg|gif|svg|ico|webp|woff2?)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
    include /etc/nginx/conf.d/security-headers.inc;
    try_files $uri =404;
  }

  # 3D 模型资源
  location ~* \.glb$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
    include /etc/nginx/conf.d/security-headers.inc;
    try_files $uri =404;
  }
}
server {
  listen 80;
  server_name _;

  include /etc/nginx/conf.d/security-headers.inc;

  root /usr/share/nginx/html;
  index index.html;

  # 作品集是 Vite 构建的静态站点（当前使用 hash 路由），这里做兜底回退
  location / {
    try_files $uri $uri/ /index.html;
  }

  # 基础缓存策略（静态资源长期缓存）
  location ~* \.(?:css|js|mjs|png|jpg|jpeg|gif|svg|ico|webp|woff2?)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
    include /etc/nginx/conf.d/security-headers.inc;
    try_files $uri =404;
  }
}
